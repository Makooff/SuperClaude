<svg width="1200" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient dark -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090b"/>
      <stop offset="100%" style="stop-color:#111118"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f1f2e" stroke-width="0.5"/>
    </pattern>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Main background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- Grid overlay -->
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.4"/>

  <!-- Purple glow orb top-left -->
  <ellipse cx="150" cy="80" rx="200" ry="150" fill="#7c3aed" opacity="0.06"/>
  <!-- Purple glow orb right -->
  <ellipse cx="1100" cy="220" rx="180" ry="130" fill="#a855f7" opacity="0.05"/>

  <!-- Left border accent line -->
  <rect x="0" y="0" width="3" height="300" fill="url(#accent)"/>

  <!-- Lightning bolt icon (left of text) -->
  <!-- Icon container: rounded square 72x72 at x=120, y=114 -->
  <rect x="120" y="114" width="72" height="72" rx="16" fill="#7c3aed" opacity="0.15"/>
  <rect x="120" y="114" width="72" height="72" rx="16" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>
  <!-- Lightning bolt path centered in 72x72 box -->
  <path d="M 163 126 L 149 153 L 158 153 L 145 186 L 167 155 L 156 155 Z"
        fill="url(#accent)" filter="url(#glow)"/>

  <!-- SuperClaude text -->
  <text x="220" y="165"
        font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="56" font-weight="700" letter-spacing="-1.5"
        fill="#fafafa">Super</text>
  <text x="390" y="165"
        font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="56" font-weight="700" letter-spacing="-1.5"
        fill="url(#accent)">Claude</text>

  <!-- Tagline -->
  <text x="220" y="200"
        font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="18" font-weight="400" letter-spacing="0.2"
        fill="#71717a">Claude Code. Amplifié.</text>

  <!-- Right side: feature pills -->
  <g transform="translate(780, 95)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="32" rx="8" fill="#111118" stroke="#1f1f2e" stroke-width="1"/>
    <text x="14" y="21" font-family="system-ui" font-size="13" fill="#71717a">⚡</text>
    <text x="34" y="21" font-family="system-ui" font-size="13" fill="#fafafa" font-weight="500">Skills auto-routés</text>
    <!-- Pill 2 -->
    <rect x="0" y="44" width="180" height="32" rx="8" fill="#111118" stroke="#1f1f2e" stroke-width="1"/>
    <text x="14" y="65" font-family="system-ui" font-size="13" fill="#71717a">🔌</text>
    <text x="34" y="65" font-family="system-ui" font-size="13" fill="#fafafa" font-weight="500">MCPs configurés</text>
    <!-- Pill 3 -->
    <rect x="0" y="88" width="180" height="32" rx="8" fill="#111118" stroke="#1f1f2e" stroke-width="1"/>
    <text x="14" y="109" font-family="system-ui" font-size="13" fill="#71717a">🧠</text>
    <text x="34" y="109" font-family="system-ui" font-size="13" fill="#fafafa" font-weight="500">Mémoire Obsidian</text>
    <!-- Pill 4 -->
    <rect x="0" y="132" width="180" height="32" rx="8" fill="#111118" stroke="#1f1f2e" stroke-width="1"/>
    <text x="14" y="153" font-family="system-ui" font-size="13" fill="#71717a">🖥</text>
    <text x="34" y="153" font-family="system-ui" font-size="13" fill="#fafafa" font-weight="500">Windows + Mac</text>
  </g>

  <!-- Bottom border line -->
  <rect x="0" y="297" width="1200" height="3" fill="url(#accent)" opacity="0.3"/>
</svg>
