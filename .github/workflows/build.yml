name: Build & Release SuperClaude Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'installer-app/**'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wine + dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y wine wine32 wine64 libwine libwine:i386 fonts-wine

      - name: Install node dependencies
        working-directory: installer-app
        run: npm install

      - name: Build Windows installer
        working-directory: installer-app
        run: npm run build-win
        env:
          WINE: wine
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: installer-app/dist/*.exe
          if-no-files-found: warn

  release:
    name: Publish Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist/
        continue-on-error: true

      - name: List dist
        run: ls -la dist/ || echo "No files"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SuperClaude latest
          prerelease: true
          body: |
            ## SuperClaude Installer

            | Plateforme | Fichier | Instructions |
            |------------|---------|--------------|
            | **Windows** | `.exe` | Double-cliquer pour installer |
            | **Mac** | `SuperClaude-Installer.command` | `chmod +x` puis double-cliquer |

            Configure automatiquement : plugins Claude Code, MCP servers, hooks Obsidian.
          files: dist/*
          fail_on_unmatched_files: false
