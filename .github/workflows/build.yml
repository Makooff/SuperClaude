name: Build & Release SuperClaude Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'installer-app/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: installer-app
        run: npm install --legacy-peer-deps

      - name: Build Windows
        working-directory: installer-app
        run: npm run build-win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: installer-app/dist/*.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: installer-app
        run: npm install --legacy-peer-deps

      - name: Build macOS
        working-directory: installer-app
        run: npm run build-mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: installer-app/dist/*.dmg
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist/

      - name: Set release info
        id: info
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.version }}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=SuperClaude $TAG" >> $GITHUB_OUTPUT

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.name }}
          prerelease: ${{ steps.info.outputs.tag == 'latest' }}
          body: |
            ## SuperClaude Installer

            | Plateforme | Fichier | Instructions |
            |------------|---------|--------------|
            | **Windows** | `.exe` | Double-cliquer → Installer |
            | **Mac** | `.dmg` | Ouvrir → glisser dans Applications |

            Configure automatiquement : plugins Claude Code, MCP servers (Magic, Playwright, Context7), hooks Obsidian.
          files: dist/*
