name: Build & Release SuperClaude Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'installer-app/**'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: installer-app
        run: npm install

      - name: Build
        working-directory: installer-app
        run: npm run build-win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: installer-app/dist/*.exe
          if-no-files-found: warn

  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: installer-app
        run: npm install

      - name: Build
        working-directory: installer-app
        run: npm run build-mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: installer-app/dist/*.dmg
          if-no-files-found: warn

  release:
    name: Publish Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist/
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist/
        continue-on-error: true

      - name: List files
        run: ls -la dist/ || echo "No dist files"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SuperClaude latest
          prerelease: true
          body: |
            ## SuperClaude Installer

            | Platform | File |
            |----------|------|
            | Windows | `.exe` - double-click to install |
            | Mac | `.dmg` - drag to Applications |

            Installs: Claude Code plugins, MCP servers, Obsidian hooks.
          files: dist/*
          fail_on_unmatched_files: false
